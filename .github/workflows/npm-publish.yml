name: npm-publish

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read
  id-token: write

concurrency:
  group: npm-publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    if: github.repository == 'MDGChamomile/pi-subagent'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Verify package release tag
        id: package_release
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          node <<'NODE'
          const { appendFileSync, readFileSync } = require("node:fs");
          const manifest = JSON.parse(readFileSync("packaging/pi-subagent/manifest.json", "utf8"));
          if (!/^\d+\.\d+\.\d+$/.test(manifest.version)) {
            throw new Error(`npm releases require a stable semver version, got ${manifest.version}`);
          }
          const expectedTag = `v${manifest.version}`;
          if (process.env.RELEASE_TAG !== expectedTag) {
            throw new Error(`Release tag ${process.env.RELEASE_TAG} does not match package version ${expectedTag}`);
          }
          appendFileSync(process.env.GITHUB_OUTPUT, 'publish=true\n');
          NODE
      - uses: actions/setup-node@v6
        if: steps.package_release.outputs.publish == 'true'
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
          cache: npm
          cache-dependency-path: extensions/pi-subagent/package-lock.json
      - name: Use an OIDC-capable npm CLI
        if: steps.package_release.outputs.publish == 'true'
        run: npm install --global npm@11.15.0
      - name: Verify package release ancestry
        if: steps.package_release.outputs.publish == 'true'
        run: |
          git fetch origin main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main
      - name: Install native search test dependency
        if: steps.package_release.outputs.publish == 'true'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ripgrep
      - name: Install locked development dependencies
        if: steps.package_release.outputs.publish == 'true'
        working-directory: extensions/pi-subagent
        run: npm ci --ignore-scripts
      - name: Typecheck
        if: steps.package_release.outputs.publish == 'true'
        working-directory: extensions/pi-subagent
        run: npm run typecheck
      - name: Test
        if: steps.package_release.outputs.publish == 'true'
        working-directory: extensions/pi-subagent
        run: npm test
      - name: Build and verify package
        if: steps.package_release.outputs.publish == 'true'
        working-directory: extensions/pi-subagent
        run: npm run package:check
      - name: Publish package with npm Trusted Publishing
        if: steps.package_release.outputs.publish == 'true'
        run: npm publish ./packaging/pi-subagent/dist --access public
