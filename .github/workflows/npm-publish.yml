name: npm-publish

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read
  id-token: write

concurrency:
  group: npm-publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    if: github.repository == 'MDGChamomile/pi-agent-kit'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
          cache: npm
          cache-dependency-path: live/extensions/pi-subagent/package-lock.json
      - name: Use an OIDC-capable npm CLI
        run: npm install --global npm@11.15.0
      - name: Verify release identity
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          node <<'NODE'
          const { readFileSync } = require("node:fs");
          const manifest = JSON.parse(readFileSync("packaging/pi-subagent/manifest.json", "utf8"));
          if (!/^\d+\.\d+\.\d+$/.test(manifest.version)) {
            throw new Error(`npm releases require a stable semver version, got ${manifest.version}`);
          }
          if (`v${manifest.version}` !== process.env.RELEASE_TAG) {
            throw new Error(`tag ${process.env.RELEASE_TAG} does not match package ${manifest.version}`);
          }
          NODE
          git fetch origin main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main
      - name: Install locked development dependencies
        working-directory: live/extensions/pi-subagent
        run: npm ci --ignore-scripts
      - name: Typecheck
        working-directory: live/extensions/pi-subagent
        run: npm run typecheck
      - name: Test
        working-directory: live/extensions/pi-subagent
        run: npm test
      - name: Build and verify package
        working-directory: live/extensions/pi-subagent
        run: npm run package:check
      - name: Publish package with npm Trusted Publishing
        run: npm publish ./packaging/pi-subagent/dist --access public
