<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Pi Subagent — delegate the investigation, keep the result</title>
  <desc id="desc">Parent Pi delegates a scoped task to a temporary, read-only subagent. The child investigates local files or the web, never both in one call. Only a bounded final result returns to the parent; incomplete results are marked partial. Intermediate investigation messages and tool results stay out of the parent model context. The parent handles implementation and final checks. These are application-level controls, not an OS, network, or credential-isolated sandbox. Authorized content may be sent to configured providers.</desc>
  <defs>
    <style>
      text { font-family: 'DejaVu Sans', sans-serif; fill: #18243b; }
      .label { font-size: 18px; font-weight: 700; letter-spacing: 2px; fill: #576b89; }
      .heading { font-size: 34px; font-weight: 700; }
      .body { font-size: 25px; fill: #435571; }
      .small { font-size: 21px; fill: #576b89; }
      .blue { fill: #245fdb; }
      .teal { fill: #087f79; }
      .flow { fill: none; stroke: #245fdb; stroke-width: 4; marker-end: url(#blue-arrow); }
      .return { fill: none; stroke: #087f79; stroke-width: 4; marker-end: url(#teal-arrow); }
      .access { fill: none; stroke: #788ba6; stroke-width: 3; marker-end: url(#gray-arrow); }
      .icon { fill: none; stroke: currentColor; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }
    </style>
    <marker id="blue-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#245fdb"/></marker>
    <marker id="teal-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#087f79"/></marker>
    <marker id="gray-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#788ba6"/></marker>
  </defs>

  <rect width="1600" height="900" fill="#f8faff"/>
  <text x="60" y="67" class="label blue">PI SUBAGENT / HOW IT WORKS</text>
  <text x="60" y="139" font-size="52" font-weight="700">Delegate the investigation. Keep the result.</text>
  <text x="60" y="191" font-size="28" fill="#435571">A focused child process keeps exploratory work out of your main conversation.</text>

  <!-- The parent owns the task and all subsequent implementation. -->
  <text x="60" y="265" class="label">YOUR MAIN CONVERSATION</text>
  <rect x="60" y="290" width="350" height="370" rx="24" fill="white" stroke="#ccd7e7" stroke-width="2"/>
  <rect x="88" y="320" width="66" height="66" rx="18" fill="#edf3ff"/>
  <g class="icon" color="#245fdb" transform="translate(100 334)">
    <path d="M3 2 H39 V28 H18 L8 37 V28 H3 Z"/>
    <path d="M11 11 H31 M11 19 H25"/>
  </g>
  <text x="88" y="438" class="heading">Parent Pi</text>
  <text x="88" y="482" class="body">Choose task + scope</text>
  <line x1="88" y1="512" x2="382" y2="512" stroke="#e0e7f1" stroke-width="2"/>
  <text x="88" y="555" class="body">Use the findings</text>
  <text x="88" y="597" class="body">Implement + verify</text>

  <!-- A child is temporary and read-only, not an implementation agent. -->
  <text x="560" y="265" class="label blue">FOCUSED INVESTIGATION</text>
  <rect x="560" y="290" width="440" height="370" rx="24" fill="#edf3ff" stroke="#acc4f5" stroke-width="2"/>
  <rect x="588" y="320" width="66" height="66" rx="18" fill="#dbe7ff"/>
  <g class="icon" color="#245fdb" transform="translate(602 332)">
    <circle cx="16" cy="16" r="12"/>
    <path d="M25 25 L37 37"/>
  </g>
  <text x="588" y="438" class="heading">Read-only subagent</text>
  <text x="588" y="482" class="body">Read, search, analyze</text>
  <line x1="588" y1="512" x2="972" y2="512" stroke="#cad9f3" stroke-width="2"/>
  <text x="588" y="555" class="body">Return a bounded answer</text>
  <text x="588" y="597" class="small">Temporary · time + tool limits</text>
  <text x="588" y="630" class="small">Incomplete? Marked as partial.</text>

  <!-- Separate task and result arrows make the context boundary visible. -->
  <text x="485" y="354" text-anchor="middle" font-size="23" font-weight="700" class="blue">Task</text>
  <path d="M410 376 H555" class="flow"/>
  <text x="485" y="535" text-anchor="middle" font-size="23" font-weight="700" class="teal">Result</text>
  <path d="M560 557 H415" class="return"/>

  <!-- These branches are alternatives, not simultaneous capabilities. -->
  <text x="1160" y="265" class="label">ONE SOURCE TYPE PER CALL</text>
  <rect x="1160" y="290" width="380" height="155" rx="24" fill="white" stroke="#ccd7e7" stroke-width="2"/>
  <g class="icon" color="#576b89" transform="translate(1190 321)">
    <path d="M0 9 V1 H18 L25 9 H43 V37 H0 Z"/>
  </g>
  <text x="1251" y="351" font-size="30" font-weight="700">Local files</text>
  <text x="1190" y="405" class="body">Only authorized paths</text>
  <text x="1350" y="485" text-anchor="middle" class="label">OR — NEVER BOTH</text>
  <rect x="1160" y="505" width="380" height="155" rx="24" fill="white" stroke="#ccd7e7" stroke-width="2"/>
  <g class="icon" color="#576b89" transform="translate(1190 535)">
    <circle cx="21" cy="21" r="20"/>
    <ellipse cx="21" cy="21" rx="9" ry="20"/>
    <path d="M1 21 H41"/>
  </g>
  <text x="1251" y="568" font-size="30" font-weight="700">Web</text>
  <text x="1190" y="620" class="body">Guarded search + fetch</text>
  <path d="M1000 475 H1078 V368 H1155" class="access"/>
  <path d="M1078 475 V583 H1155" class="access"/>
  <circle cx="1078" cy="475" r="6" fill="#788ba6"/>

  <rect x="60" y="706" width="1480" height="82" rx="20" fill="#e5f4f1"/>
  <text x="800" y="740" text-anchor="middle" font-size="25" font-weight="700" class="teal">Intermediate reads and searches stay out of the parent context.</text>
  <text x="800" y="771" text-anchor="middle" font-size="21" fill="#396b66">Only the final result returns — and it may still quote source material.</text>

  <text x="60" y="832" font-size="20" font-weight="700" fill="#576b89">Application-level controls — not an OS, network, or credential-isolated sandbox.</text>
  <text x="60" y="866" font-size="20" fill="#576b89">Authorized content may be sent to configured model / search providers.</text>
</svg>
